<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>练不练</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div class="page">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">∴</span>练不练<span class="brand-dot">.</span></div>
      <div class="header-actions">
        <button id="game" class="header-button" aria-label="选择玩法" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h4m-2-2v4m7-1h.01m3-2h.01M7.39 6h9.22a4 4 0 0 1 3.92 3.22l1.44 7.2a2 2 0 0 1-3.38 1.81L16.35 16h-8.7l-2.24 2.23a2 2 0 0 1-3.38-1.81l1.44-7.2A4 4 0 0 1 7.39 6Z"/></svg>
          玩法
        </button>
        <button id="probability" class="header-button" aria-label="设置练的概率" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h3m5 0h8M4 17h9m5 0h2"/><circle cx="9.5" cy="7" r="2.5"/><circle cx="15.5" cy="17" r="2.5"/></svg>
          概率
        </button>
      </div>
    </header>
    <main>
      <!-- The scene draws inside #stage; everything else here is shared by every game. -->
      <button class="stage" id="stage" disabled></button>
      <div class="result" id="result" role="status" aria-live="polite"></div>
      <div class="actions">
        <p class="error" id="error" role="alert" hidden></p>
        <button class="primary" id="draw" disabled><span id="draw-label"></span><span aria-hidden="true">→</span></button>
        <button class="shortcut" id="record">已经决定了，直接记录 ↗</button>
      </div>
    </main>
  </div>
  <script src="shell.js"></script>
</body>
</html>
