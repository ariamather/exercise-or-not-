<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 5 · 圆润活泼</title>
<style>
  :root{--bg:#FFF6E9;--ink:#1E1B18;--sub:#7A6F64;--card:#FFFFFF;--y:#FFD45C;--g:#7BD88F;--p:#FF9EB5;--b:#8EC5FF;--rest:#B9B0FF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Yuanti SC","PingFang SC","Arial Rounded MT Bold",sans-serif;background:var(--bg);color:var(--ink);width:390px;height:844px;overflow:hidden;position:relative}
  .n{font-family:"Arial Rounded MT Bold","Yuanti SC",sans-serif;font-variant-numeric:tabular-nums}
  .scroll{height:100%;overflow-y:auto;padding:50px 18px 110px}
  .scroll::-webkit-scrollbar{display:none}
  .box{border:2.5px solid var(--ink);border-radius:22px;box-shadow:4px 4px 0 var(--ink)}

  .hi{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .hi h1{font-size:26px;font-weight:900}
  .hi .avatar{width:42px;height:42px;border-radius:50%;background:var(--p);border:2.5px solid var(--ink);display:grid;place-items:center;font-size:18px}

  .hero{background:var(--y);padding:18px;position:relative;transition:background .3s}
  body.rest .hero{background:var(--rest)}
  .hero .r{display:flex;align-items:center;gap:16px}
  .die{width:92px;height:92px;background:#fff;border:2.5px solid var(--ink);border-radius:22px;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;
       box-shadow:0 5px 0 var(--ink);transform:rotate(-8deg);flex:none}
  .die span{border-radius:50%}.die .pip{background:var(--ink)}
  .die.rolling{animation:bounce .32s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(20deg)}}
  .hero .t small{font-size:14px;font-weight:700}
  .hero .t b{display:block;font-size:30px;font-weight:900;margin-top:2px}
  .bubble{position:absolute;right:14px;top:-14px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;transform:rotate(4deg)}
  .faces{display:flex;gap:6px;margin:16px 0 14px}
  .faces span{flex:1;height:34px;border-radius:12px;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;font-weight:900}
  .faces span.on{background:var(--ink);color:var(--y)}
  .btns{display:flex;gap:10px}
  .btn{flex:1;padding:13px;border-radius:16px;border:2.5px solid var(--ink);font:inherit;font-weight:900;font-size:16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);background:#fff}
  .btn:active{transform:translate(3px,3px);box-shadow:none}
  .btn.main{background:var(--g)}

  .day{margin:24px 4px 12px;display:flex;justify-content:space-between;align-items:center}
  .day b{font-size:20px;font-weight:900}
  .pill{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800}

  .ex{background:var(--card);padding:14px;margin-bottom:16px}
  .ex .h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .emoji{width:40px;height:40px;border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center;font-size:20px}
  .ex .h b{font-size:18px;font-weight:900}
  .ex .h small{display:block;font-size:12px;color:var(--sub);font-weight:600}
  .sets{display:flex;flex-direction:column;gap:8px}
  .set{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:#F4F1EC}
  .set .i{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900}
  .set .v{font-size:19px;font-weight:900}
  .set .v small{font-size:12px;color:var(--sub);font-weight:700;margin-left:6px}
  .set .badge{font-size:12px;font-weight:900;background:var(--g);border:2px solid var(--ink);border-radius:999px;padding:2px 8px}
  .set.pend{background:#fff;border:2.5px dashed var(--ink);grid-template-columns:30px 1fr 1fr 50px;padding:10px}
  .set.pend .i{background:var(--y);color:var(--ink);border:2px solid var(--ink)}
  .f{border:2px solid var(--ink);border-radius:12px;padding:4px 8px;text-align:center}
  .f b{font-size:20px;font-weight:900}.f small{font-size:11px;color:var(--sub);margin-left:2px}
  .ok{width:48px;height:48px;border-radius:16px;background:var(--g);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;font-size:22px;font-weight:900}
  .last{font-size:12px;color:var(--sub);font-weight:700;margin:8px 4px 0}

  .add{width:100%;padding:16px;background:var(--b);font:inherit;font-weight:900;font-size:16px;cursor:pointer}

  nav{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;display:flex;gap:6px;background:#fff;padding:6px;border-radius:999px}
  nav a{padding:10px 24px;border-radius:999px;font-weight:900;font-size:15px}
  nav a.on{background:var(--ink);color:#fff}
</style>
<script src="dice.js"></script>
</head>
<body>
<div class="scroll">
  <div class="hi"><h1>今天练不练？</h1><span class="avatar">⚙</span></div>

  <section class="hero box">
    <span class="bubble n">50% 练</span>
    <div class="r">
      <div class="die" data-die></div>
      <div class="t"><small>掷出了 <span class="n" data-num>5</span> 点</small><b data-verdict data-go="出发练吧 💪" data-rest="好好休息 🛋">出发练吧 💪</b></div>
    </div>
    <div class="faces n"><span>1</span><span>2</span><span>3</span><span class="on">4</span><span class="on">5</span><span class="on">6</span></div>
    <div class="btns"><button class="btn" data-roll>🎲 再掷</button><button class="btn main">开始记录</button></div>
  </section>

  <div class="day"><b>11月14日 周六</b><span class="pill">已完成 2 组</span></div>

  <article class="ex box">
    <div class="h"><span class="emoji" style="background:var(--p)">🏋️</span><div><b>卧推</b><small>总重 · 上次 11-11</small></div></div>
    <div class="sets n">
      <div class="set"><span class="i">1</span><span class="v">40 × 10<small>上次 37.5×10</small></span><span class="badge">+2.5</span></div>
      <div class="set"><span class="i">2</span><span class="v">40 × 10<small>上次 37.5×8</small></span><span class="badge">+2.5</span></div>
      <div class="set pend"><span class="i">3</span><div class="f"><b>40</b><small>kg</small></div><div class="f"><b>10</b><small>次</small></div><span class="ok">✓</span></div>
    </div>
    <p class="last">上次第 3 组 37.5 × 8</p>
  </article>

  <article class="ex box">
    <div class="h"><span class="emoji" style="background:var(--b)">🦵</span><div><b>深蹲</b><small>总重 · 上次 11-11</small></div></div>
    <div class="sets n">
      <div class="set pend"><span class="i">1</span><div class="f"><b>60</b><small>kg</small></div><div class="f"><b>8</b><small>次</small></div><span class="ok">✓</span></div>
    </div>
  </article>

  <button class="add box">＋ 添加动作</button>
</div>
<nav class="box"><a class="on">记录</a><a>历史</a></nav>
</body>
</html>
