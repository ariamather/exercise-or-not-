<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 1 · 清新卡片</title>
<style>
  :root{
    --bg:#F3F6F2; --card:#FFFFFF; --ink:#18201B; --sub:#6B756E; --line:#E6EBE6;
    --g:#2F6A4F; --g2:#3E8A66; --gl:#E3F1E8; --rest:#7C8A99;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink);
       width:390px;height:844px;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased}
  .scroll{height:100%;overflow-y:auto;padding:52px 18px 110px}
  .scroll::-webkit-scrollbar{display:none}
  .num{font-variant-numeric:tabular-nums}

  /* 骰子主卡 */
  .hero{border-radius:28px;padding:22px;color:#fff;position:relative;overflow:hidden;
        background:linear-gradient(135deg,#2F6A4F 0%,#4B9A72 100%);box-shadow:0 12px 30px -12px rgba(47,106,79,.55);transition:background .4s}
  body.rest .hero{background:linear-gradient(135deg,#5E6E7E 0%,#8C9BAA 100%);box-shadow:0 12px 30px -12px rgba(80,95,110,.5)}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;opacity:.85}
  .hero .gear{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:16px}
  .hero .mid{display:flex;align-items:center;gap:18px;margin:16px 0 18px}
  .die{width:84px;height:84px;border-radius:20px;background:#fff;padding:13px;display:grid;grid-template-columns:repeat(3,1fr);
       gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.12),inset 0 -4px 0 #E8EEE9;flex:none}
  .die span{border-radius:50%}
  .die .pip{background:#1F3A2D}
  .die.rolling{animation:spin .25s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .verdict small{display:block;font-size:13px;opacity:.85;margin-bottom:2px}
  .verdict b{font-size:40px;font-weight:800;letter-spacing:2px}
  .hero .actions{display:flex;gap:10px}
  .btn{border:0;border-radius:14px;padding:12px 16px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .btn.ghost{background:rgba(255,255,255,.18);color:#fff}
  .btn.white{background:#fff;color:var(--g);flex:1}
  body.rest .btn.white{color:#5E6E7E}

  /* 日期 */
  .date{display:flex;justify-content:space-between;align-items:flex-end;margin:26px 4px 12px}
  .date h2{font-size:24px;font-weight:800}
  .date p{font-size:13px;color:var(--sub);margin-top:2px}
  .chip{font-size:13px;color:var(--g);background:var(--gl);padding:7px 12px;border-radius:999px;font-weight:600}

  /* 动作卡 */
  .ex{background:var(--card);border-radius:22px;padding:16px 16px 14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px -8px rgba(0,0,0,.08)}
  .ex .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .ex .head b{font-size:18px}
  .ex .head span{font-size:12px;color:var(--sub);background:var(--bg);padding:3px 8px;border-radius:6px;margin-left:6px;font-weight:500}
  .ex .more{color:var(--sub);font-size:20px;letter-spacing:1px}
  .cols,.row{display:grid;grid-template-columns:26px 1fr 1.25fr 40px;align-items:center;gap:8px}
  .cols{font-size:12px;color:var(--sub);padding:0 4px 6px}
  .row{padding:9px 4px;border-top:1px solid var(--line);font-size:15px}
  .row .i{color:var(--sub);font-weight:600}
  .row .last{color:var(--sub);font-size:14px}
  .row .now{font-weight:700}
  .done{width:28px;height:28px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;font-size:14px;font-weight:800;justify-self:end}
  .up{color:var(--g2);font-size:12px;font-weight:700;margin-left:4px}
  .pending{margin-top:6px;background:#F7FAF7;border:1.5px dashed #BFD8C9;border-radius:16px;padding:10px;grid-template-columns:26px 1fr 1fr 48px;border-top:1.5px dashed #BFD8C9}
  .field{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
  .field small{display:block;font-size:10px;color:var(--sub)}
  .field b{font-size:18px}
  .field i{font-style:normal;font-size:12px;color:var(--sub);margin-left:3px}
  .ok{width:46px;height:46px;border-radius:14px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 6px 14px -6px rgba(47,106,79,.7)}
  .hint{font-size:12px;color:var(--sub);padding:8px 4px 0}

  .add{width:100%;border:1.5px dashed #B9C6BD;background:transparent;color:var(--g);border-radius:18px;padding:16px;font:inherit;font-weight:700;font-size:15px}

  /* 底栏 */
  nav{position:absolute;left:18px;right:18px;bottom:22px;height:64px;border-radius:22px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
      display:flex;justify-content:space-around;align-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.2)}
  nav a{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);font-weight:600;padding:10px 18px;border-radius:14px;text-decoration:none}
  nav a.on{background:var(--gl);color:var(--g)}
</style>
<script src="dice.js"></script>
</head>
<body>
<div class="scroll">
  <section class="hero">
    <div class="top"><span>今天练不练？ · 掷出 4、5、6 就练 · 50%</span><span class="gear">⚙</span></div>
    <div class="mid">
      <div class="die" data-die></div>
      <div class="verdict"><small>掷出 <span data-num>5</span></small><b data-verdict data-go="今天练" data-rest="今天休息">今天练</b></div>
    </div>
    <div class="actions">
      <button class="btn ghost" data-roll>再掷一次</button>
      <button class="btn white">开始记录 →</button>
    </div>
  </section>

  <div class="date">
    <div><h2>11月14日 周六</h2><p>今天 · 1 个动作已记录 2 组</p></div>
    <span class="chip">📅 换日期</span>
  </div>

  <article class="ex">
    <div class="head"><div><b>卧推</b><span>总重</span></div><span class="more">⋯</span></div>
    <div class="cols"><span>组</span><span>上次 11-11</span><span>本次</span><span></span></div>
    <div class="row num"><span class="i">1</span><span class="last">37.5 × 10</span><span class="now">40 × 10<span class="up">↑2.5</span></span><span class="done">✓</span></div>
    <div class="row num"><span class="i">2</span><span class="last">37.5 × 8</span><span class="now">40 × 10<span class="up">↑2</span></span><span class="done">✓</span></div>
    <div class="row pending num"><span class="i">3</span>
      <div class="field"><small>重量</small><b>40</b><i>kg</i></div>
      <div class="field"><small>次数</small><b>10</b><i>次</i></div>
      <span class="ok">✓</span></div>
    <p class="hint">上次第 3 组：37.5 × 8</p>
  </article>

  <article class="ex">
    <div class="head"><div><b>深蹲</b><span>总重</span></div><span class="more">⋯</span></div>
    <div class="cols"><span>组</span><span>上次 11-11</span><span>本次</span><span></span></div>
    <div class="row pending num"><span class="i">1</span>
      <div class="field"><small>重量</small><b>60</b><i>kg</i></div>
      <div class="field"><small>次数</small><b>8</b><i>次</i></div>
      <span class="ok">✓</span></div>
    <p class="hint">上次第 1 组：60 × 8</p>
  </article>

  <button class="add">＋ 添加动作</button>
</div>
<nav><a class="on">✎ 记录</a><a>☰ 历史</a></nav>
</body>
</html>
