<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 3 · 训练手账</title>
<style>
  :root{--paper:#F5EFE3;--paper2:#EDE5D4;--ink:#2B2A33;--sub:#8A8273;--rule:#D9CEB8;--blue:#2F4A8A;--red:#C2412D;--rest:#5E7F6E}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Songti SC","Noto Serif SC","STSong",serif;color:var(--ink);width:390px;height:844px;overflow:hidden;position:relative;
       background:var(--paper);background-image:radial-gradient(rgba(120,100,60,.06) 1px,transparent 1px);background-size:6px 6px}
  .hand{font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .n{font-family:"Courier New","Menlo",monospace;font-variant-numeric:tabular-nums}
  .scroll{height:100%;overflow-y:auto;padding:50px 22px 100px}
  .scroll::-webkit-scrollbar{display:none}

  .masthead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:8px}
  .masthead h1{font-size:30px;letter-spacing:4px}
  .masthead .d{text-align:right;font-size:13px;color:var(--sub);line-height:1.5}
  .masthead .d b{display:block;font-size:22px;color:var(--ink)}

  .dice{display:flex;gap:18px;align-items:center;padding:20px 0 18px;border-bottom:1px dashed var(--rule);position:relative}
  .die{width:70px;height:70px;border:2px solid var(--ink);border-radius:12px;padding:11px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#FBF8F1;transform:rotate(-6deg);flex:none}
  .die span{border-radius:50%}.die .pip{background:var(--ink)}
  .die.rolling{animation:tumble .3s linear infinite}
  @keyframes tumble{to{transform:rotate(354deg)}}
  .dice .txt{flex:1}
  .dice .txt p{font-size:14px;color:var(--sub)}
  .dice .txt .hand{font-size:22px;margin:4px 0 8px}
  .dice .txt button{font:inherit;font-size:14px;background:none;border:0;border-bottom:1px solid var(--ink);padding:0 0 1px;cursor:pointer;color:var(--ink)}
  .stamp{width:84px;height:84px;border-radius:50%;border:3px solid var(--red);color:var(--red);display:grid;place-items:center;transform:rotate(12deg);
         font-family:"Kaiti SC","STKaiti",serif;font-size:36px;font-weight:700;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--red);opacity:.88;flex:none}
  body.rest .stamp{border-color:var(--rest);color:var(--rest);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--rest);font-size:30px}

  .ex{margin-top:22px}
  .ex h2{font-size:20px;display:flex;align-items:baseline;gap:10px}
  .ex h2 small{font-size:12px;color:var(--sub);font-weight:normal}
  .ex h2 .tag{margin-left:auto;font-size:12px;color:var(--blue);border:1px solid var(--blue);padding:1px 6px;border-radius:3px;font-weight:normal}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
  th{font-weight:normal;font-size:12px;color:var(--sub);text-align:left;padding:4px 6px;border-bottom:1.5px solid var(--ink)}
  td{padding:9px 6px;border-bottom:1px solid var(--rule)}
  td:first-child{width:28px;color:var(--sub)}
  td.last{color:var(--sub)}
  td.now{color:var(--blue);font-family:"Kaiti SC","STKaiti",serif;font-size:19px}
  td.mk{width:30px;text-align:right;color:var(--red);font-size:18px}
  tr.pend td{background:rgba(47,74,138,.06);border-bottom:1.5px dashed var(--blue)}
  .blank{display:inline-block;min-width:44px;border-bottom:1.5px solid var(--blue);text-align:center;color:var(--blue);font-family:"Kaiti SC","STKaiti",serif;font-size:19px}
  .tickbox{display:inline-grid;place-items:center;width:26px;height:26px;border:1.5px solid var(--blue);border-radius:4px;color:var(--blue);font-size:14px}
  .note{margin-top:8px;font-size:14px;color:var(--sub)}

  .add{display:block;margin:26px auto 0;font:inherit;font-size:15px;background:none;border:0;color:var(--ink);border-bottom:1px solid var(--ink);cursor:pointer}

  nav{position:absolute;left:0;right:0;bottom:0;height:74px;background:var(--paper2);border-top:1px solid var(--rule);display:flex}
  nav a{flex:1;display:grid;place-items:center;font-size:15px;color:var(--sub);letter-spacing:4px}
  nav a.on{color:var(--ink);font-weight:700;background:var(--paper);border-top:3px solid var(--red);margin-top:-1px}
</style>
<script src="dice.js"></script>
</head>
<body>
<div class="scroll">
  <div class="masthead">
    <h1>练不练</h1>
    <div class="d"><b class="n">11·14</b>星期六 · 第 12 页</div>
  </div>

  <section class="dice">
    <div class="die" data-die></div>
    <div class="txt">
      <p>掷出 4、5、6 就练（一半一半）</p>
      <p class="hand">掷出 <span data-num>5</span>，<span data-verdict data-go="那就去练吧。" data-rest="今天歇着。">那就去练吧。</span></p>
      <button data-roll>再掷一次</button>
    </div>
    <div class="stamp" data-verdict data-go="练" data-rest="休">练</div>
  </section>

  <section class="ex">
    <h2>卧推 <small>杠铃 · 总重</small><span class="tag">上次 11·11</span></h2>
    <table class="n">
      <tr><th>组</th><th>上次</th><th>本次</th><th></th></tr>
      <tr><td>一</td><td class="last">37.5 × 10</td><td class="now">40 × 10</td><td class="mk">✓</td></tr>
      <tr><td>二</td><td class="last">37.5 × 8</td><td class="now">40 × 10</td><td class="mk">✓</td></tr>
      <tr class="pend"><td>三</td><td class="last">37.5 × 8</td><td><span class="blank">40</span> × <span class="blank">10</span></td><td class="mk"><span class="tickbox">✓</span></td></tr>
    </table>
    <p class="note hand">比上次每组多了 2.5 kg。</p>
  </section>

  <section class="ex">
    <h2>深蹲 <small>杠铃 · 总重</small><span class="tag">上次 11·11</span></h2>
    <table class="n">
      <tr><th>组</th><th>上次</th><th>本次</th><th></th></tr>
      <tr class="pend"><td>一</td><td class="last">60 × 8</td><td><span class="blank">60</span> × <span class="blank">8</span></td><td class="mk"><span class="tickbox">✓</span></td></tr>
    </table>
  </section>

  <button class="add">＋ 再记一个动作</button>
</div>
<nav><a class="on">记录</a><a>翻看</a></nav>
</body>
</html>
