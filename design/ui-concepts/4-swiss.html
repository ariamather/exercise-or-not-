<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 4 · 大字极简</title>
<style>
  :root{--bg:#FFFFFF;--ink:#0A0A0A;--sub:#8E8E8E;--line:#EAEAEA;--acc:#FF4F1A;--rest:#1A5CFF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Helvetica Neue",-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink);width:390px;height:844px;overflow:hidden;position:relative}
  body{--a:var(--acc)} body.rest{--a:var(--rest)}
  .n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .scroll{height:100%;overflow-y:auto;padding:48px 22px 100px}
  .scroll::-webkit-scrollbar{display:none}

  .top{display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.5px}
  .top span:last-child{color:var(--sub)}

  .hero{margin-top:18px;position:relative}
  .hero .label{font-size:15px;font-weight:600}
  .hero .huge{font-size:150px;font-weight:900;line-height:.9;letter-spacing:-6px;color:var(--a);margin:6px 0 0 -6px;transition:color .3s}
  .hero .meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:2px solid var(--ink)}
  .hero .meta p{font-size:14px}
  .hero .meta p b{font-weight:800}
  .die{position:absolute;right:0;top:34px;width:96px;height:96px;background:var(--ink);border-radius:6px;padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .die span{border-radius:50%}.die .pip{background:#fff}
  .die.rolling{animation:f .1s steps(2) infinite}
  @keyframes f{50%{transform:translate(2px,-3px) rotate(8deg)}}
  .roll{font:inherit;font-size:14px;font-weight:800;background:none;border:0;color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:4px}

  .row6{display:grid;grid-template-columns:repeat(6,1fr);margin-top:12px;border:2px solid var(--ink)}
  .row6 span{text-align:center;padding:8px 0;font-weight:800;font-size:15px;border-right:2px solid var(--ink)}
  .row6 span:last-child{border-right:0}
  .row6 span.on{background:var(--ink);color:#fff}

  .day{margin:34px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
  .day h2{font-size:34px;font-weight:900;letter-spacing:-1px}
  .day span{font-size:13px;color:var(--sub)}

  .ex{border-top:2px solid var(--ink);padding-top:12px;margin-top:18px}
  .ex .h{display:flex;justify-content:space-between;align-items:baseline}
  .ex .h b{font-size:22px;font-weight:800}
  .ex .h span{font-size:12px;color:var(--sub)}
  .s{display:grid;grid-template-columns:28px 1fr 1fr 24px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
  .s.hd{font-size:11px;color:var(--sub);font-weight:600;padding:12px 0 4px}
  .s .i{font-size:13px;color:var(--sub);font-weight:700}
  .s .l{font-size:16px;color:var(--sub)}
  .s .c{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .s .c small{font-size:13px;color:var(--sub);font-weight:500;margin:0 2px}
  .s .k{font-weight:900;color:var(--ink);text-align:right}
  .s.p{border-bottom:2px solid var(--a);align-items:center}
  .s.p .c{color:var(--a)}
  .s.p .k{width:40px;height:40px;background:var(--a);color:#fff;display:grid;place-items:center;font-size:20px;border-radius:0;justify-self:end}
  .s.p{grid-template-columns:28px 1fr 1fr 44px}

  .add{margin-top:24px;width:100%;padding:18px;background:var(--ink);color:#fff;border:0;font:inherit;font-size:16px;font-weight:800;text-align:left;display:flex;justify-content:space-between}

  nav{position:absolute;left:0;right:0;bottom:0;height:70px;background:#fff;border-top:2px solid var(--ink);display:grid;grid-template-columns:1fr 1fr}
  nav a{display:flex;align-items:center;padding-left:22px;font-size:15px;font-weight:800;color:var(--sub)}
  nav a.on{color:var(--ink)}
  nav a.on::before{content:"";width:8px;height:8px;background:var(--a);margin-right:8px}
</style>
<script src="dice.js"></script>
</head>
<body>
<div class="scroll">
  <div class="top"><span>练不练</span><span class="n">2026 / 11 / 14 SAT</span></div>

  <section class="hero">
    <p class="label">今天</p>
    <div class="huge" data-verdict data-go="练。" data-rest="歇。">练。</div>
    <div class="die" data-die></div>
    <div class="row6 n"><span>1</span><span>2</span><span>3</span><span class="on">4</span><span class="on">5</span><span class="on">6</span></div>
    <div class="meta"><p>掷出 <b class="n" data-num>5</b> · 概率 <b class="n">50%</b></p><button class="roll" data-roll>再掷一次 ↻</button></div>
  </section>

  <div class="day"><h2>记录</h2><span class="n">2 组 · 2 个动作</span></div>

  <section class="ex">
    <div class="h"><b>卧推</b><span>总重 kg</span></div>
    <div class="s hd"><span>#</span><span>上次 11/11</span><span>本次</span><span></span></div>
    <div class="s n"><span class="i">01</span><span class="l">37.5×10</span><span class="c">40<small>×</small>10</span><span class="k">✓</span></div>
    <div class="s n"><span class="i">02</span><span class="l">37.5×8</span><span class="c">40<small>×</small>10</span><span class="k">✓</span></div>
    <div class="s p n"><span class="i">03</span><span class="l">37.5×8</span><span class="c">40<small>×</small>10</span><span class="k">✓</span></div>
  </section>

  <section class="ex">
    <div class="h"><b>深蹲</b><span>总重 kg</span></div>
    <div class="s hd"><span>#</span><span>上次 11/11</span><span>本次</span><span></span></div>
    <div class="s p n"><span class="i">01</span><span class="l">60×8</span><span class="c">60<small>×</small>8</span><span class="k">✓</span></div>
  </section>

  <button class="add"><span>添加动作</span><span>＋</span></button>
</div>
<nav><a class="on">记录</a><a>历史</a></nav>
</body>
</html>
