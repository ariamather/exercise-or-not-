<style>

<script>
(() => {
  const root=document.getElementById('eon-stats-candidates');
  const $=s=>root.querySelector(s);
  const workouts=[
    ['2026-10-27',['杠铃卧推','深蹲']],['2026-10-29',['哑铃肩推','引体向上']],['2026-10-31',['杠铃卧推','深蹲']],
    ['2026-11-03',['深蹲','引体向上']],['2026-11-05',['杠铃卧推','深蹲','哑铃肩推']],['2026-11-08',['杠铃卧推','深蹲']],
    ['2026-11-10',['哑铃肩推','引体向上']],['2026-11-12',['杠铃卧推','深蹲','哑铃肩推']],['2026-11-14',['引体向上','哑铃肩推']],['2026-11-16',['杠铃卧推','深蹲','哑铃肩推']],
  ].map(([date,exercises])=>({date,exercises,sets:exercises.length*3}));
  const state={period:'weeks',exercise:'bench',month:11,day:'2026-11-16'};
  const configs=Object.fromEntries([...root.querySelectorAll('[data-exercise-config]')].map(el=>[el.dataset.exerciseConfig,JSON.parse(el.textContent)]));
  const baseFrequency=JSON.parse($('#eon-frequency-config').textContent);
  const shortDate=d=>d.slice(5).split('-').map(Number).join('/');
  const friendlyDate=d=>`${Number(d.slice(5,7))} 月 ${Number(d.slice(8))} 日`;
  function save(){const api=window.openai;if(api?.setWidgetState)api.setWidgetState({modelContent:{period:state.period,exercise:state.exercise,selectedDate:state.day},privateContent:{...state}}).catch(()=>{});}
  function apply(saved){if(!saved||typeof saved!=='object')return;if(['weeks','month'].includes(saved.period))state.period=saved.period;if(configs[saved.exercise])state.exercise=saved.exercise;if([10,11].includes(saved.month))state.month=saved.month;if(typeof saved.day==='string'&&/^2026-(10|11)-\d{2}$/.test(saved.day)&&saved.day<='2026-11-17')state.day=saved.day;}
  function renderHistory(target,entries){target.replaceChildren();for(const w of entries){const item=document.createElement('details');item.className='eon-session';item.innerHTML=`<summary class="cursor-interaction"><span>${friendlyDate(w.date)}</span><span>${w.exercises.length} 个动作 · ${w.sets} 组 ＋</span></summary><div class="eon-session-body">${w.exercises.map(name=>`<div>${name}<span>3 组</span></div>`).join('')}</div>`;target.append(item);}}
  function frequencyConfig(){return {...baseFrequency,rows:state.period==='month'?baseFrequency.rows.slice(1):baseFrequency.rows};}
  function renderOverview(){const shown=workouts.filter(w=>state.period==='weeks'||w.date>='2026-11-01');$('[data-metric="days"]').innerHTML=`${shown.length}<span> 天</span>`;$('[data-metric="sets"]').innerHTML=`${shown.reduce((sum,w)=>sum+w.sets,0)}<span> 组</span>`;$('[data-metric="exercises"]').innerHTML=`${new Set(shown.flatMap(w=>w.exercises)).size}<span> 个</span>`;$('[data-period-label]').textContent=state.period==='weeks'?'10/26—11/17':'11/1—11/17';root.querySelectorAll('[data-period]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.period===state.period)));renderHistory($('[data-history="overview"]'),shown.slice(-2).reverse());}
  function renderProgress(){const config=configs[state.exercise],rows=config.rows,last=rows.at(-1),previous=rows.at(-2),bodyweight=state.exercise==='pullup';$('#eon-exercise-select').value=state.exercise;$('[data-recent-date]').textContent=shortDate(last[0]);$('[data-recent-set]').innerHTML=bodyweight?`${last[1]} <span>次 · 自重</span>`:`${last[1]} <span>kg ×</span> ${last[2]} <span>次</span>`;$('[data-recent-change]').textContent=bodyweight?`上次 ${previous[1]} 次`:`上次 ${previous[1]} kg × ${previous[2]} 次`;$('[data-trend-title]').textContent=bodyweight?'单组最高次数变化':'最高重量变化';$('[data-history="progress"]').innerHTML=rows.slice(-2).reverse().map(row=>`<div class="eon-progress-row"><span>${shortDate(row[0])}</span><span>${bodyweight?row[1]+' 次 · 自重':row[1]+' kg × '+row[2]+' 次'}</span></div>`).join('');}
  function renderCalendar(){const month=String(state.month).padStart(2,'0'),prefix='2026-'+month;$('#eon-month-label').textContent=`2026 年 ${state.month} 月`;$('#eon-month-prev').disabled=state.month===10;$('#eon-month-next').disabled=state.month===11;const inMonth=workouts.filter(w=>w.date.startsWith(prefix));$('[data-month-total]').textContent=`${inMonth.length} 天 · ${inMonth.reduce((sum,w)=>sum+w.sets,0)} 组`;const days=$('#eon-calendar-days');days.replaceChildren();const first=(new Date(Date.UTC(2026,state.month-1,1)).getUTCDay()+6)%7,count=new Date(Date.UTC(2026,state.month,0)).getUTCDate();for(let i=0;i<first;i++){const blank=document.createElement('span');blank.setAttribute('aria-hidden','true');days.append(blank);}for(let d=1;d<=count;d++){const date=prefix+'-'+String(d).padStart(2,'0'),workout=workouts.find(w=>w.date===date),button=document.createElement('button');button.type='button';button.className='eon-day cursor-interaction';button.textContent=d;button.dataset.trained=String(!!workout);button.setAttribute('aria-pressed',String(state.day===date));button.setAttribute('aria-label',friendlyDate(date)+(workout?`，训练 ${workout.sets} 组`:'，无训练记录'));button.disabled=date>'2026-11-17';button.onclick=()=>{state.day=date;renderCalendar();save();};days.append(button);}const selected=workouts.find(w=>w.date===state.day);$('[data-selected-day]').textContent=friendlyDate(state.day);$('[data-selected-total]').textContent=selected?`${selected.sets} 组`:'';$('[data-history="calendar"]').innerHTML=selected?selected.exercises.map(name=>`<div class="eon-selected-exercise"><span>${name}</span><small>3 组</small></div>`).join(''):'<p class="eon-empty">这天没有训练记录</p>';}
  function render(){renderOverview();renderProgress();renderCalendar();root.dispatchEvent(new CustomEvent('eon-config-change'));}
  apply(window.openai?.widgetState?.privateContent);
  render();
  root.querySelectorAll('[data-period]').forEach(button=>{button.classList.add('cursor-interaction');button.onclick=()=>{state.period=button.dataset.period;renderOverview();root.dispatchEvent(new CustomEvent('eon-config-change'));save();};});
  $('#eon-exercise-select').onchange=event=>{state.exercise=event.target.value;renderProgress();root.dispatchEvent(new CustomEvent('eon-config-change'));save();};
  for(const [id,delta] of [['eon-month-prev',-1],['eon-month-next',1]]){const button=$('#'+id);button.classList.add('cursor-interaction');button.onclick=()=>{state.month+=delta;state.day=state.month===10?'2026-10-31':'2026-11-16';renderCalendar();save();};}
  root.eonChartConfigs=()=>({frequency:frequencyConfig(),progress:configs[state.exercise]});
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent;if(saved){apply(saved);render();}});

<script type="module">
import {mountChart} from 'https://persistent.oaistatic.com/plugins/visualize/charts/1.6.5/element.js';
const root=document.getElementById('eon-stats-candidates');
const charts={};
const slots={frequency:root.querySelector('#eon-frequency-container'),progress:root.querySelector('#eon-progress-container')};
function refresh(){const configs=root.eonChartConfigs();for(const key of Object.keys(slots)){if(slots[key].closest('[data-variant]').hidden)continue;if(charts[key])charts[key].config=configs[key];else charts[key]=mountChart(slots[key],configs[key]);}}
refresh();root.addEventListener('eon-config-change',refresh);
const observer=new MutationObserver(refresh);for(const variant of root.querySelectorAll(':scope > [data-variant]'))observer.observe(variant,{attributes:true,attributeFilter:['hidden']});
</script>
